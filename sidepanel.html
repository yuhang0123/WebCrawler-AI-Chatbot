<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WebCrawler AI Chatbot</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <h1>WebCrawler AI Chatbot</h1>
    <div id="pageTitle" class="page-title">Loading…</div>
    <div id="pageUrl" class="page-url"></div>
    <div class="controls">
      <label><input type="checkbox" id="isFullPage"> Include menus &amp; footers</label>
    </div>
  </header>

  <main id="log"></main>
  <div id="status" class="status"></div>

  <form id="chatForm">
    <input id="question" placeholder="Ask about this page…" autocomplete="off" required>
    <button id="sendButton">Send</button>
  </form>

  <script src="pageReader.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
